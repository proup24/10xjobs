name: Dev database

# Migrates and seeds the shared dev database (Supabase Cloud) once CI has
# passed on main, then production once the maintainer approves. Never runs
# for pull requests.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    concurrency:
      group: dev-database
      cancel-in-progress: false
    env:
      XJOBS_SKIP_ENV_FILES: '1'
      XJOBS_ALLOW_REMOTE_DB: '1'
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Installs the pnpm version pinned in package.json's packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Apply the Prisma migrations
        run: pnpm --filter @xjobs/database db:migrate

      - name: Seed the database
        run: pnpm --filter @xjobs/database db:seed

  production:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits for the maintainer's approval on this environment before it runs.
    environment: production-database
    # More than one run may wait for approval. Before approving, check the
    # run's commit is the latest on main; if not, reject it and the next run
    # takes its place. Migrations are forward-only, so approving an older
    # run is harmless but needs a second approval.
    concurrency:
      group: production-database
      cancel-in-progress: false
    env:
      XJOBS_SKIP_ENV_FILES: '1'
      XJOBS_ALLOW_REMOTE_DB: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Installs the pnpm version pinned in package.json's packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Apply the Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter @xjobs/database db:migrate

      - name: Seed the list data
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter @xjobs/database db:seed --only processor-lists,iso,cities
