name: Dev database

# The SHA in the run name tells Deploy engine which commit was migrated.
run-name: Dev database ${{ github.event.workflow_run.head_sha }}

# Migrates and seeds the shared dev database (Supabase Cloud) once CI has
# passed on main. Never runs for pull requests.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    concurrency:
      group: dev-database
      cancel-in-progress: false
    env:
      XJOBS_SKIP_ENV_FILES: '1'
      XJOBS_ALLOW_REMOTE_DB: '1'
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Installs the pnpm version pinned in package.json's packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Migrates only when @xjobs/database changed since the last migrated commit
      - name: Decide whether the database changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          base=$(node .github/ci/last-handled.mjs --workflow dev-database.yml --job deploy)
          if [ -n "$base" ] && git cat-file -e "$base^{commit}"; then
            node .github/ci/changes.mjs --base "$base" --head "$SHA"
          else
            echo "::notice::No last migrated commit found; migrating anyway"
            node .github/ci/changes.mjs --all
          fi

      - name: Apply the Prisma migrations
        if: steps.changes.outputs.migrate == 'true'
        run: pnpm --filter @xjobs/database db:migrate

      - name: Seed the database
        if: steps.changes.outputs.migrate == 'true'
        run: pnpm --filter @xjobs/database db:seed

      - name: Report the skipped migration
        if: steps.changes.outputs.migrate != 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: echo "::notice::No database change since $BASE; skipped migrate and seed"
