name: Deploy engine

# The SHA in the run name lets the next run find the commit of the last deploy.
run-name: Deploy engine ${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || inputs.image_tag || github.sha }}

# Builds the engine image, pushes it to GHCR and rolls it out to the Hetzner
# server once the Dev database workflow has migrated the dev database.
#
# Chain depth: CI -> Dev database -> Deploy engine is three workflow_run
# levels, which is GitHub's maximum. Do not chain another workflow after this.
#
# Four jobs keep the credentials apart: `check` and `changes` only read,
# `build` alone can push to GHCR, and `deploy` alone holds the SSH key and a
# read-only registry token.
on:
  workflow_run:
    workflows: [Dev database]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image SHA to redeploy (full 40-character commit SHA)
        type: string
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: deploy-engine
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/proup24/10xjobs-engine

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.guard.outputs.skip == 'true' || steps.migrations.outputs.skip == 'true' || steps.resolve.outputs.skip == 'true' }}
      sha: ${{ steps.resolve.outputs.sha }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Guard on the server being configured
        id: guard
        env:
          ENGINE_SSH_HOST: ${{ secrets.ENGINE_SSH_HOST }}
        run: |
          if [ -z "$ENGINE_SSH_HOST" ]; then
            echo "::notice::ENGINE_SSH_HOST not set; skipping engine deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The workflow_run conclusion is Dev database's overall result, and a
      # run whose `deploy` job was skipped (CI failed, or not a push) also ends
      # green. Only deploy when the migrations really ran.
      - name: Guard on the migrations having run
        id: migrations
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          conclusion="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "deploy") | .conclusion] | .[0] // "none"')"
          if [ "$conclusion" != "success" ]; then
            echo "::notice::Dev database job 'deploy' concluded '$conclusion'; migrations did not run, skipping engine deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # On workflow_run, `head_sha` is main's HEAD when this run was triggered,
      # which can be newer than the commit Dev database migrated if merges land
      # in quick succession. Dev database's run-name carries the SHA it actually
      # migrated (CI's head_sha), so read it from display_title.
      - name: Resolve the commit to deploy
        id: resolve
        if: steps.guard.outputs.skip != 'true' && steps.migrations.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          EVENT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          build=true
          if [ "$EVENT_NAME" = workflow_run ]; then
            mapfile -t found < <(printf '%s\n' "$TITLE" | grep -owE '[0-9a-f]{40}' || true)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one 40-character SHA in the Dev database run title, found ${#found[@]}"
              exit 1
            fi
            sha="${found[0]}"
          elif [ -n "$INPUT_TAG" ]; then
            sha="$INPUT_TAG"
            build=false
          else
            # Building here would deploy code whose migrations never ran
            if [ "$REF" != refs/heads/main ]; then
              echo "::notice::Dispatch without image_tag only builds from main (ref is $REF); skipping engine deploy"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="$EVENT_SHA"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$sha' is not a full 40-character lowercase commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # Automatic runs build and deploy only when the engine project changed since
  # the last run whose `deploy` job succeeded. A manual dispatch always deploys.
  changes:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.dispatch.outputs.deploy || steps.detect.outputs.deploy }}
    steps:
      - name: Deploy on every manual dispatch
        id: dispatch
        if: github.event_name != 'workflow_run'
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager field
      - uses: pnpm/action-setup@v6
        if: github.event_name == 'workflow_run'

      - uses: actions/setup-node@v6
        if: github.event_name == 'workflow_run'
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'workflow_run'

      - name: Decide whether the engine changed
        id: detect
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          if [ ! -f .github/ci/changes.mjs ]; then
            echo "::notice::Commit predates change detection; running everything"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(node .github/ci/last-handled.mjs --workflow deploy-engine.yml --job deploy)
          if [ -n "$base" ] && git cat-file -e "$base^{commit}"; then
            node .github/ci/changes.mjs --base "$base" --head "$SHA"
          else
            echo "::notice::No last deployed commit found; deploying anyway"
            node .github/ci/changes.mjs --all
          fi

      - name: Report the skipped deploy
        if: github.event_name == 'workflow_run' && steps.detect.outputs.deploy != 'true'
        env:
          BASE: ${{ steps.detect.outputs.base }}
        run: echo "::notice::No engine change since $BASE; skipping build and deploy"

  build:
    needs: [check, changes]
    if: needs.check.result == 'success' && needs.check.outputs.skip != 'true' && needs.check.outputs.build == 'true' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # `build` defaults to NODE_ENV=production; prune adds package.json, the
      # lockfile and workspace_modules to apps/xjobs/dist.
      - name: Build and prune the engine
        run: pnpm exec nx run @xjobs/xjobs:prune

      - name: Check the dist layout
        run: |
          for f in main.js worker.js package.json pnpm-lock.yaml workspace_modules; do
            test -e "apps/xjobs/dist/$f" || { echo "::error::apps/xjobs/dist/$f is missing"; exit 1; }
          done

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/xjobs
          file: apps/xjobs/Dockerfile
          push: true
          # The source label links a new GHCR package to this repository, so
          # the deploy job's GITHUB_TOKEN can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # When two merges deploy out of order, `:dev` can briefly point at the
          # older build: this job cannot know. The deploy job still refuses to
          # roll the server back to it.
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.sha }}
            ${{ env.IMAGE }}:dev

  deploy:
    needs: [check, changes, build]
    if: >-
      !cancelled() && needs.check.result == 'success' && needs.check.outputs.skip != 'true' &&
      needs.changes.result == 'success' && needs.changes.outputs.deploy == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.check.outputs.sha }}
      ENGINE_SSH_HOST: ${{ secrets.ENGINE_SSH_HOST }}
      ENGINE_SSH_USER: ${{ secrets.ENGINE_SSH_USER }}
    steps:
      # Checked out at the deployed SHA, even for a rollback, so the copied
      # deploy files match the image.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      # The deployed SHA may predate worker-hold.sh, and a rollback must still
      # hold a stopped worker, so the script comes from the workflow's own commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-tooling
          sparse-checkout: deploy/engine/worker-hold.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up SSH
        id: ssh
        env:
          ENGINE_SSH_PRIVATE_KEY: ${{ secrets.ENGINE_SSH_PRIVATE_KEY }}
          ENGINE_SSH_KNOWN_HOSTS: ${{ secrets.ENGINE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ENGINE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ENGINE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CONF'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            BatchMode yes
          CONF

      # Parallel CI runs for two quick merges can finish out of order. Never let
      # an automatic deploy roll the server back to an older commit. Manual
      # dispatches skip this check, so rollbacks still work.
      - name: Skip if the server runs a newer commit
        id: newer
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          raw="$(ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" \
            'if [ -f ~/engine/image.env ]; then sed -n "s/^ENGINE_IMAGE_TAG=//p" ~/engine/image.env; fi')"
          current="$(printf '%s' "$raw" | tr -d '\r"' | head -n 1)"
          if [ -z "$current" ]; then
            echo "No deployed image recorded; first deploy"
            exit 0
          fi
          if ! [[ "$current" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::ENGINE_IMAGE_TAG on the server is not a commit SHA; deploying anyway"
            exit 0
          fi
          if [ "$current" = "$SHA" ]; then
            echo "The server already runs $SHA; redeploying"
            exit 0
          fi
          # compare/BASE...HEAD: `ahead` means HEAD (the running commit) has
          # commits that BASE (the new one) lacks, so the server is newer.
          if ! status="$(gh api "repos/$REPO/compare/$SHA...$current" --jq .status 2>/dev/null)"; then
            echo "::error::Could not compare $SHA with the running $current"
            exit 1
          fi
          echo "compare $SHA...$current: $status"
          if [ "$status" = ahead ]; then
            echo "::notice::The server runs $current, which is newer than $SHA; skipping the rollout"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs before anything on the server changes: a worker that was stopped
      # before this deploy stays stopped.
      - name: Decide whether to start the worker
        id: worker
        if: steps.newer.outputs.stale != 'true'
        run: |
          decision="$(ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" 'bash -s' < .deploy-tooling/deploy/engine/worker-hold.sh)"
          if [ "$decision" != start ] && [ "$decision" != hold ]; then
            echo "::error::Unexpected worker decision '$decision'"
            exit 1
          fi
          echo "Worker decision: $decision"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      # Staged in .incoming/ so a failed pull leaves the live files untouched.
      - name: Copy the deploy files
        if: steps.newer.outputs.stale != 'true'
        run: |
          ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" 'mkdir -p ~/engine/.incoming'
          scp deploy/engine/compose.yaml deploy/engine/Caddyfile "$ENGINE_SSH_USER@$ENGINE_SSH_HOST:engine/.incoming/"

      # The token goes over ssh stdin only: never into a command line or the log.
      - name: Log the server in to GHCR
        if: steps.newer.outputs.stale != 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029  # the actor is quoted on purpose, client side
          printf '%s' "$GHCR_TOKEN" | ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" \
            "docker login ghcr.io -u $(printf '%q' "$ACTOR") --password-stdin"

      # Pull with the staged compose file first; only a successful pull moves
      # the files into place and records the new tag in image.env.
      # `--project-directory .` keeps `env_file: .env` and `./Caddyfile`
      # resolving in ~/engine rather than in .incoming/.
      - name: Roll out the image
        if: steps.newer.outputs.stale != 'true'
        env:
          DECISION: ${{ steps.worker.outputs.decision }}
        run: |
          # shellcheck disable=SC2029  # the validated SHA and decision are quoted on purpose, client side
          ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" "bash -s $(printf '%q' "$SHA") $(printf '%q' "$DECISION")" <<'REMOTE'
          set -euo pipefail
          cd ~/engine
          ENGINE_IMAGE=ghcr.io/proup24/10xjobs-engine
          # Remove every engine image whose tag isn't one of the arguments,
          # then dangling layers. An image a container still uses is refused
          # by `docker image rm`, so this never breaks what is running.
          keep_engine_images() {
            docker image ls "$ENGINE_IMAGE" --format '{{.Tag}}' | while read -r tag; do
              case " $* " in
                *" $tag "*) ;;
                *) docker image rm "$ENGINE_IMAGE:$tag" > /dev/null 2>&1 || true ;;
              esac
            done
            docker image prune -f > /dev/null
          }
          previous="$(sed -n 's/^ENGINE_IMAGE_TAG=//p' image.env 2> /dev/null || true)"
          # Make room before the pull: on a full disk the pull fails, and the
          # cleanup after the rollout never runs (2026-11-14).
          keep_engine_images "$previous"
          ENGINE_IMAGE_TAG="$1" docker compose -p xjobs-engine -f .incoming/compose.yaml \
            --project-directory . --env-file .env pull api worker
          mv .incoming/compose.yaml compose.yaml
          # Rewrite in place: caddy bind-mounts this single file, which pins its
          # inode, so a renamed-over file would stay invisible to the container.
          cat .incoming/Caddyfile > Caddyfile
          rm .incoming/Caddyfile
          printf 'ENGINE_IMAGE_TAG=%s\n' "$1" > image.env
          C="docker compose -p xjobs-engine --env-file image.env --env-file .env"
          case "$2" in
            start)
              $C up -d --remove-orphans
              ;;
            hold)
              # Never a bare `up -d`: it would start the stopped worker.
              $C up -d --remove-orphans api redis redis-cache caddy
              $C up --no-start worker
              echo "::notice::Worker was stopped before this deploy; left stopped on $1. Start it with \$C start worker"
              ;;
            *)
              echo "::error::unknown worker decision '$2'"
              exit 1
              ;;
          esac
          # `up` does not recreate caddy for a Caddyfile change; reload it.
          $C exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          # Keep the new image and the one it replaced, for a quick rollback;
          # older ones are pulled again from GHCR when a rollback needs them.
          keep_engine_images "$1" "$previous"
          REMOTE

      - name: Health check
        if: steps.newer.outputs.stale != 'true'
        run: |
          # Ask the running Caddy for the hostname Compose resolved from .env, so
          # any .env syntax Compose accepts (spaces, `export`, quotes) works here too.
          raw="$(ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" 'docker exec xjobs-engine-caddy-1 printenv ENGINE_HOSTNAME')" || {
            echo "::error::Could not read ENGINE_HOSTNAME from the caddy container over ssh"
            exit 1
          }
          ENGINE_HOST="$(printf '%s' "$raw" | tr -d '\r"')"
          if ! [[ "$ENGINE_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::ENGINE_HOSTNAME is missing or invalid in the caddy container"
            exit 1
          fi
          # Runs on the server: the key is read from the api container there and
          # never reaches CI or the log. No `set -x` in this script.
          # shellcheck disable=SC2029  # the validated hostname is quoted on purpose, client side
          ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" "bash -s $(printf '%q' "$ENGINE_HOST")" <<'REMOTE'
          set -euo pipefail
          host="$1"
          cd ~/engine
          C="docker compose -p xjobs-engine --env-file image.env --env-file .env"
          cid="$($C ps -q api)"
          status=none
          for _ in $(seq 1 24); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)"
            [ "$status" = healthy ] && break
            sleep 5
          done
          if [ "$status" != healthy ]; then
            echo "::error::The api container is '$status', not healthy"
            exit 1
          fi
          key="$(docker exec "$cid" printenv ENGINE_API_KEY | tr -d '\r' || true)"
          if [ -z "$key" ]; then
            echo "::error::ENGINE_API_KEY is not set in the api container"
            exit 1
          fi
          # The header goes over stdin (-H @-), so the key is not in curl's argv.
          if ! printf 'X-Engine-Key: %s\n' "$key" | curl -sf -o /dev/null \
            --retry 12 --retry-delay 5 --retry-all-errors -H @- "https://$host/api/health"; then
            echo "::error::Health check with the key failed for https://$host/api/health"
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://$host/api/health")"
          if [ "$code" != 401 ]; then
            echo "::error::Health without the key answered $code, expected 401"
            exit 1
          fi
          echo "Healthy with the key; 401 without it"
          worker="$($C ps -a --format '{{.State}}' worker | head -n 1 || true)"
          echo "Worker: ${worker:-none}"
          REMOTE

      # Also covers a failed `up -d`, which never reaches the health check.
      - name: Dump container status and logs
        if: failure() && steps.ssh.outcome == 'success'
        run: |
          ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" \
            'cd ~/engine && C="docker compose -p xjobs-engine --env-file image.env --env-file .env"; $C ps; $C logs --tail 100 api worker' || true

      - name: Log the server out of GHCR
        if: always()
        run: ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" 'docker logout ghcr.io' || true
