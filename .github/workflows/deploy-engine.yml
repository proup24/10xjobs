name: Deploy engine

# Builds the engine image, pushes it to GHCR and rolls it out to the Hetzner
# server once the Dev database workflow has migrated the dev database.
#
# Chain depth: CI -> Dev database -> Deploy engine is three workflow_run
# levels, which is GitHub's maximum. Do not chain another workflow after this.
#
# Three jobs keep the credentials apart: `check` only reads, `build` is the
# only job that can push to GHCR, and `deploy` holds the SSH key and a
# read-only registry token.
on:
  workflow_run:
    workflows: [Dev database]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image SHA to redeploy (full 40-character commit SHA)
        type: string
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: deploy-engine
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/proup24/10xjobs-engine

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.guard.outputs.skip == 'true' || steps.migrations.outputs.skip == 'true' || steps.resolve.outputs.skip == 'true' }}
      sha: ${{ steps.resolve.outputs.sha }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Guard on the server being configured
        id: guard
        env:
          ENGINE_SSH_HOST: ${{ secrets.ENGINE_SSH_HOST }}
        run: |
          if [ -z "$ENGINE_SSH_HOST" ]; then
            echo "::notice::ENGINE_SSH_HOST not set; skipping engine deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The workflow_run conclusion is Dev database's overall result, and a
      # run whose `deploy` job was skipped (CI failed, or not a push) also ends
      # green. Only deploy when the migrations really ran.
      - name: Guard on the migrations having run
        id: migrations
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          conclusion="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "deploy") | .conclusion] | .[0] // "none"')"
          if [ "$conclusion" != "success" ]; then
            echo "::notice::Dev database job 'deploy' concluded '$conclusion'; migrations did not run, skipping engine deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # On workflow_run, `head_sha` is main's HEAD when this run was triggered,
      # which can be newer than the commit Dev database migrated if merges land
      # in quick succession. Dev database's run-name carries the SHA it actually
      # migrated (CI's head_sha), so read it from display_title.
      - name: Resolve the commit to deploy
        id: resolve
        if: steps.guard.outputs.skip != 'true' && steps.migrations.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          EVENT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          build=true
          if [ "$EVENT_NAME" = workflow_run ]; then
            mapfile -t found < <(printf '%s\n' "$TITLE" | grep -owE '[0-9a-f]{40}' || true)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one 40-character SHA in the Dev database run title, found ${#found[@]}"
              exit 1
            fi
            sha="${found[0]}"
          elif [ -n "$INPUT_TAG" ]; then
            sha="$INPUT_TAG"
            build=false
          else
            # Building here would deploy code whose migrations never ran
            if [ "$REF" != refs/heads/main ]; then
              echo "::notice::Dispatch without image_tag only builds from main (ref is $REF); skipping engine deploy"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="$EVENT_SHA"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$sha' is not a full 40-character lowercase commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.result == 'success' && needs.check.outputs.skip != 'true' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # `build` defaults to NODE_ENV=production; prune adds package.json, the
      # lockfile and workspace_modules to apps/xjobs/dist.
      - name: Build and prune the engine
        run: pnpm exec nx run @xjobs/xjobs:prune

      - name: Check the dist layout
        run: |
          for f in main.js worker.js package.json pnpm-lock.yaml workspace_modules; do
            test -e "apps/xjobs/dist/$f" || { echo "::error::apps/xjobs/dist/$f is missing"; exit 1; }
          done

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/xjobs
          file: apps/xjobs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.sha }}
            ${{ env.IMAGE }}:dev

  deploy:
    needs: [check, build]
    if: >-
      !cancelled() && needs.check.result == 'success' && needs.check.outputs.skip != 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.check.outputs.sha }}
      ENGINE_SSH_HOST: ${{ secrets.ENGINE_SSH_HOST }}
      ENGINE_SSH_USER: ${{ secrets.ENGINE_SSH_USER }}
    steps:
      # Checked out at the deployed SHA, even for a rollback, so the copied
      # deploy files match the image.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Set up SSH
        env:
          ENGINE_SSH_PRIVATE_KEY: ${{ secrets.ENGINE_SSH_PRIVATE_KEY }}
          ENGINE_SSH_KNOWN_HOSTS: ${{ secrets.ENGINE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ENGINE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ENGINE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CONF'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            BatchMode yes
          CONF

      - name: Copy the deploy files
        run: scp deploy/engine/compose.yaml deploy/engine/Caddyfile "$ENGINE_SSH_USER@$ENGINE_SSH_HOST:engine/"

      # The token goes over ssh stdin only: never into a command line or the log.
      - name: Log the server in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029  # the actor is quoted on purpose, client side
          printf '%s' "$GHCR_TOKEN" | ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" \
            "docker login ghcr.io -u $(printf '%q' "$ACTOR") --password-stdin"

      - name: Roll out the image
        run: |
          # shellcheck disable=SC2029  # the validated SHA is quoted on purpose, client side
          ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" "bash -s $(printf '%q' "$SHA")" <<'REMOTE'
          set -euo pipefail
          cd ~/engine
          printf 'ENGINE_IMAGE_TAG=%s\n' "$1" > image.env
          C="docker compose -p xjobs-engine --env-file image.env --env-file .env"
          $C pull api worker
          $C up -d --remove-orphans
          # Remove images created more than a week ago (by image creation time, not pull time)
          docker image prune -af --filter "until=168h"
          REMOTE

      - name: Health check
        run: |
          raw="$(ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" "bash -c 'set -o pipefail; grep ^ENGINE_HOSTNAME= ~/engine/.env | cut -d= -f2-'")" || {
            echo "::error::Could not read ENGINE_HOSTNAME from ~/engine/.env over ssh"
            exit 1
          }
          ENGINE_HOST="$(printf '%s' "$raw" | tr -d '\r"')"
          if ! [[ "$ENGINE_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::ENGINE_HOSTNAME is missing or invalid in ~/engine/.env"
            exit 1
          fi
          if ! curl -fsS --retry 24 --retry-delay 5 --retry-all-errors "https://$ENGINE_HOST/api/health"; then
            echo "::error::Health check failed for https://$ENGINE_HOST/api/health"
            ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" 'cd ~/engine && C="docker compose -p xjobs-engine --env-file image.env --env-file .env" ; $C ps; $C logs --tail 100 api worker' || true
            exit 1
          fi

      - name: Log the server out of GHCR
        if: always()
        run: ssh "$ENGINE_SSH_USER@$ENGINE_SSH_HOST" 'docker logout ghcr.io' || true
