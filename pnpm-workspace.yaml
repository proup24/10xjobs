packages:
  - apps/*
  - libs/*
allowBuilds:
  msgpackr-extract: false
  '@parcel/watcher': false
  '@scarf/scarf': false
  esbuild: false
  nx: false
  unrs-resolver: false
  workerd: false
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.137'
  - ai@7.0.164
permissions:
  '@openrouter/sdk':
    build: false
  '@prisma/orm-postgres':
    skills: false
  libpq:
    build: false
  prisma:
    skills: false
